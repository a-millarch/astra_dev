# ASTRA v2 Finetuning Configuration
# Used by: python -m astra.training.train

finetune:
  # Phase 1: Head-only training (warm up randomly initialized head)
  phase1_epochs: 5
  phase1_lr: 1.0e-3

  # Phase 2: Partial unfreeze (upper transformer layers + head)
  phase2_epochs: 12
  phase2_lr: 3.0e-4
  phase2_unfreeze_from: transformer_4_5

  # Phase 3: Full finetune (all layers, discriminative LRs)
  phase3_epochs: 8
  phase3_lr: 1.0e-4

  # Phase 4: Early prediction hardening (optional)
  enable_early_prediction: false
  phase4_epochs: 8
  phase4_lr: 5.0e-5
  masking_prob: 0.5
  early_weight: 2.0
  min_timesteps: 2

  # Discriminative learning rates
  lr_decay_factor: 0.1         # embedding_lr = head_lr * lr_decay_factor

  # Optimization
  weight_decay: 0.01
  warmup_fraction: 0.1         # fraction of phase steps for LR warmup
  grad_clip: 1.0
  label_smoothing: 0.1

  # Validation / early stopping
  patience: 7
  valid_size: 0.2              # fraction of trainval used for validation

  # Pretrained weights
  use_pretrained: true

  # Per-timestep prediction head
  temporal_head: false
  causal: false                    # auto-enabled when temporal_head=true; prevents future info leakage
  temporal_head_dropout: 0.3
  time_weighting: uniform        # 'uniform' or 'early'
  early_weight_factor: 2.0

sweep:
  # Stage 1: Architecture search
  arch:
    n_trials: 30
    search_space:
      d_model: [32, 64, 128]
      n_layers: [4, 6, 8, 10]
      n_heads: [4, 8]
      fc_mults_1: [0.1, 0.5]
      fc_mults_2: [0.05, 0.3]
      fc_dropout: [0.1, 0.8]
      res_dropout: [0.0, 0.4]

  # Stage 2: Training HP search
  training:
    n_trials: 50
    search_space:
      finetune_lr: [1.0e-5, 1.0e-3]   # log scale
      weight_decay: [1.0e-4, 1.0e-1]   # log scale
      label_smoothing: [0.0, 0.2]
      lr_decay_factor: [0.01, 0.5]     # log scale
      phase1_epochs: [2, 8]
      phase2_epochs: [5, 20]
      phase3_epochs: [3, 15]
      phase4_epochs: [0, 10]           # 0 = skip early prediction
      masking_prob: [0.3, 0.7]
      early_weight: [1.0, 3.0]
