single_patient_mode: False

population_file_path: data/raw/trauma_call_historic_population.csv
trauma_call_file_path: data/external/trauma_call.csv

model_name: '20052026_pt'

target: deceased_30d

# Pre-hospital (PPJ) data integration
prehospital: false                     # Set true to enable pre-hospital data pipeline
prehospital_only: false                # If true, only include patients WITH PPJ data to data collection pipeline

prehospital_config:
  sources:
    - name: RegH
      ppj_mapping_path: data/raw/ppj_mapping.csv
      ppj_data_paths:
        - data/raw/ppj/
      mapping_sep: ";"
      mapping_timestamp_format: sas
    - name: RegSJ
      ppj_mapping_path: data/raw/ppjsj_mapping.csv
      ppj_data_paths:
        - data/interim/ppjsj.csv
      raw_data_path: data/dl/PPJ_RegSJ.csv
      mapping_sep: ","
      mapping_timestamp_format: iso
  max_hours_before_admission: 48
  event_descriptions_path: data/external/event_descriptions_modified.xlsx
  # Override event codes if event_descriptions not available:
  # gcs_event_codes: []
  # abcd_event_codes:
  #   "A: Luftveje": ["CODE"]
  #   "B: Respiration": ["CODE"]
  #   "C: Cirkulation": ["CODE"]
  #   "D: Bevidsthedsniveau": ["CODE"]


temporal_features:
  enabled: false
  # mode controls how temporal features are used when enabled:
  #   channel    – elapsed_hours and bin_width_hours are normalized and fed through W_P
  #                as regular input channels (Option A). No change to positional encoding.
  #   sinusoidal – elapsed_hours drives sinusoidal positional encoding; both temporal
  #                features are excluded from W_P (Option B). W_P operates on clinical
  #                channels only (~N(0,1)), raw hours used for sin/cos encoding.
  mode: channel #sinusoidal
  features:
    - elapsed_hours
    - bin_width_hours

categorical_profiles:
  enabled: true
  config_file: configs/profiles.yaml     # path to profile definitions

ebm_feature:
  enabled: false
  save_dir: data/interim/ebm_features
  n_folds: 5
  interval_schedule:  # EBM masking intervals: {boundary: step_size}
    30min: '10min'    # 0 → 30min: every 10min  (~3 intervals)
    4h: '1h'          # 30min → 4h: every 1h    (~4 intervals)
    24h: '4h'         # 4h → 24h: every 4h      (~5 intervals)
    72h: '6h'         # 24h → 72h: every 6h     (~8 intervals)
    6D: '12h'         # 72h → 6D: every 12h     (~6 intervals)
    14D: '1D'         # 6D → 14D: every 1D      (~8 intervals)
    30D: '3D'         # 14D → 30D: every 3D     (~5 intervals)
    90D: '7D'         # 30D → 90D: every 7D     (~9 intervals)


# Trauma text (clinical notes) keyword marking
traumatext_config:
  enabled: true
  source_file: data/interim/concepts/Notater.pkl
  text_column: Note
  timestamp_column: Oprettelsestidspunkt
  time_window_hours: 12
  keywords:
    - traume
    - trauma
    - tilskadekomst
    - traumemodtagelse
    - traumecenter

concepts:
  - ITAOversigtsrapport
  - VitaleVaerdier
  - InvasiveMonitoring  # derived from VitaleVaerdier — must be listed after it
  - Labsvar
  - Medicin
  #- Procedurer
  - ADTHaendelser
  - EWS
  - ISS_notes
  - ISS_computed
  - Events
  #- IndUd
  #- ITARespirator


dataset:
  exclusion: traumatext  # null = no exclusion, or profile name: "study", "lvl1tc", etc.
  min_bin_seq_len: 1

  id_col: PID
  ts_cat_names:
      - Medicin
      - Procedurer
      - ADTHaendelser
      - Events
      - InvasiveMonitoring
  ts_categorical_multi_label:
      - Medicin
      - Procedurer
      - ADTHaendelser
      - Events
      - InvasiveMonitoring
  cat_encoder_names:
      Medicin: medication
      Procedurer: procedures
      ADTHaendelser: ADT
      Events: event
      InvasiveMonitoring: invasive_monitoring

  cat_cols:
      - SEX
      - FIRST_HOSPITAL

  # Pre-hospital ABCD categorical columns (only used when prehospital: true)
  ppj_cat_cols:
      - A
      - B
      - C
      - D

  num_cols:
      - AGE
      - ASMT_ELIX
      - HEIGHT
      - WEIGHT

# Exclusion criteria profiles — selected by dataset.exclusion
exclusion_criteria:
  study:
    age_min: 0
    age_max: 90
    start_year: 2017
    end_year: null
    lvl1tc: false
    prehospital_only: true
    traumatext: true
    traumatext_12h: false
    max_duration_days: 365
    min_bin_seq_len: 1
    first_hospital:
      - null
    custom_filters: []
    # Example custom_filters:
    # - column: DURATION
    #   op: "<="
    #   value: 365

  lvl1tc:
    lvl1tc: true
    traumatext: true

  traumatext:
    traumatext: true

  study3:
    pid_file: data/external/studypop.csv

pretrain:
    mask_prob_ts: 0.15
    mask_prob_cat_ts: 0.15
    mask_prob_cat: 0.15
    mask_prob_cont: 0.15
    epochs: 30
    lr: 5.0e-5
    warmup_epochs: 3
    ts_loss_weight: 1.5
    cat_ts_loss_weight: 1.5
    cat_loss_weight: 1.0
    cont_loss_weight: 1.0
    contrastive_weight: 0.5
    temperature: 0.07
    patience: 4
    save_best: True
    checkpoint_dir: './pretrain_checkpoints'

    # Sparse-aware masking: preferentially mask non-empty timesteps
    sparse_aware_masking: true
    mask_prob_ts_data: 0.30
    mask_prob_ts_empty: 0.05
    mask_prob_cat_ts_data: 0.40
    mask_prob_cat_ts_empty: 0.03

training:
    bs: 32

model:
  d_model: 192
  n_layers: 4
  n_heads: 16
  fc_mults_1: 0.1
  fc_mults_2: 0.05
  fc_dropout: 0.4
  res_dropout: 0.1
  head_pool: mean_cat
  temporal_head_dropout: 0.55

  temporal_head: true
  causal: true  # required for temporal_head

  survival_mode: false  # true = discrete-time survival, false = binary classification

finetune:
  phase1_epochs: 3
  phase1_lr: 0.002095169972417103
  phase2_epochs: 17
  phase2_lr: 0.0003896
  phase2_unfreeze_from: transformer_4_5
  phase3_epochs: 9
  phase3_lr: 7.25e-05
  phase4_epochs: 10
  phase4_lr: 1.348e-05
  enable_early_prediction: true
  masking_prob: 0.6000000000000001
  early_weight: 1.8
  lr_decay_factor: 0.05623310957562682
  weight_decay: 0.005374083850821259
  label_smoothing: 0.09
  pos_weight_factor: 0.6000000000000001
  time_weighting: early
  temporal_loss_averaging: per_sample
  # NOTE: the deployed 20052026_pt was trained with the YAML *string* 'false'
  # here, which Python treats as truthy — i.e. eval-timeframe weighting was
  # effectively ON (weight 3.0) during its training. `true` preserves that
  # actual behavior for reproducibility; flip to a bare `false` only as a
  # deliberate change for a future retrain.
  eval_timeframe_weighting: true
  eval_timeframe_weight: 3.0
  ranking_loss_weight: 0.15000000000000002
  temporal_crop_prob: 0.0
  temporal_crop_all_phases: false
  # ── End sweep results ──


  # Phase 4 settings
  min_timesteps: 2

  # Optimization
  warmup_fraction: 0.1
  grad_clip: 1.0

  # Validation / early stopping
  patience: 7
  valid_size: 0.2

  # Pretrained weights
  use_pretrained: true

  # Temporal head
  early_weight_factor: 2.0


  # Pairwise ranking loss
  ranking_loss_n_timeframes: 5
  ranking_loss_max_pairs: 10000


sweep:
    # Joint architecture + training HP search (no pretraining during sweep)
    # (trial count via the --n-trials CLI flag)
    study_patience: 12
    study_min_delta: 0.005   # minimum AUROC+AUPRC improvement to reset patience
    search_space:
        # Architecture
        d_model: [32, 64, 128]
        n_layers: [2, 4, 6, 8]
        n_heads: [4, 8]
        fc_mults_1: [0.1, 0.5]
        fc_mults_2: [0.05, 0.3]
        fc_dropout: [0.1, 0.9]
        res_dropout: [0.0, 0.4]
        temporal_head_dropout: [0.0, 0.8]
        head_pool: [flatten, mean_cat]
        # Training HPs (LR parameterized as base_lr x decay^phase)
        base_lr: [5.0e-4, 1.0e-2]            # log scale; phase 1 LR
        lr_phase_decay: [0.05, 0.5]          # log scale; ratio between consecutive phases
        phase1_epochs: [2, 8]
        phase2_epochs: [5, 20]
        phase3_epochs: [3, 15]
        phase4_epochs: [0, 10]               # 0 = skip early prediction
        weight_decay: [1.0e-4, 1.0e-1]       # log scale
        label_smoothing: [0.0, 0.2]
        lr_decay_factor: [0.01, 0.5]         # log scale
        masking_prob: [0.3, 0.7]
        early_weight: [1.0, 3.0]
        pos_weight_factor: [0.3, 1.0]        # log scale
        temporal_crop_prob: [0.0, 0.8]       # probability of cropping per batch
        # Temporal loss improvements (only active when temporal_head=true)
        temporal_loss_averaging: [per_sample, global]
        eval_timeframe_weighting: [true, false]
        eval_timeframe_weight: [1.5, 5.0]
        ranking_loss_weight: [0.0, 0.3]
        early_weight_factor: [1.0, 5.0]
        # Validation objective balance (only active when temporal_head=true)
        val_auroc_weight: [0.1, 0.9]

evaluation:
    shap_seed: 42           # RNG seed for reproducible SHAP values (null to disable)
    shap_nsamples: 200      # Number of interpolation samples for GradientExplainer

normalization:
  ts_method: adaptive       # standard | quantile | power | robust | adaptive
  tab_method: adaptive      # standard | quantile | power | robust | adaptive
  n_quantiles: 1000         # max quantiles for quantile method
  quantile_output: normal   # normal | uniform
  clip_range: null           # null (disabled) or [min, max] e.g. [-3, 3] to clip normalized output
  boundary_range_frac: 0.05  # fraction of value range defining boundary zone (adaptive only)
  boundary_mass_thresh: 0.40 # mass fraction in boundary zone that overrides quantile -> robust

base_df_path: data/interim/base_df.pkl
raw_file_path: https://forskerpln0ybkrdls01.blob.core.windows.net/sp-data/
bin_df_path: data/interim/mapped/bin_df.pkl



