  overwrite: True
  max_duration_days: 365 #now cut off using bins
  min_bin_seq_len: 1

  id_col: PID
  ts_cat_names:
      - Medicin
      - Procedurer
      - ADTHaendelser
      - Events
  ts_categorical_multi_label:
      - Medicin
      - Procedurer
      - ADTHaendelser
      - Events
  cat_encoder_names:
      Medicin: medication
      Procedurer: procedures
      ADTHaendelser: ADT
      Events: event

  cat_cols:
      - SEX
      - FIRST_HOSPITAL

  # Pre-hospital ABCD categorical columns (only used when prehospital: true)
  ppj_cat_cols:
      - A
      - B
      - C
      - D

  num_cols:
      - AGE
      - ASMT_ELIX
      - HEIGHT
      - WEIGHT

# Exclusion criteria profiles — selected by dataset.exclusion
exclusion_criteria:
  study:
    age_min: 0
    age_max: 90
    start_year: 2017
    end_year: null
    lvl1tc: false
    prehospital_only: true
    traumatext: true
    traumatext_12h: false
    max_duration_days: 365
    first_hospital:
      - null
    custom_filters: []
    # Example custom_filters:
    # - column: DURATION
    #   op: "<="
    #   value: 365

  lvl1tc:
    lvl1tc: true
    traumatext: true
    
  traumatext:
    traumatext: true

  study3:
    pid_file: data/external/studypop.csv

pretrain:
    mask_prob_ts: 0.15
    mask_prob_cat_ts: 0.15
    mask_prob_cat: 0.15
    mask_prob_cont: 0.15
    epochs: 5
    lr: 5.0e-5
    warmup_epochs: 3
    ts_loss_weight: 1.5
    cat_ts_loss_weight: 1.5
    cat_loss_weight: 1.0
    cont_loss_weight: 1.0
    contrastive_weight: 0.5
    temperature: 0.07
    patience: 3
    save_best: True
    checkpoint_dir: './pretrain_checkpoints'

training:
    folds: 5
    epochs: 30
    bs: 32
    
model:
    res_dropout: 0.22
    fc_dropout: 0.75
    fc_mults_1: 0.3
    fc_mults_2: 0.1
    n_layers: 8
    n_heads: 8
    d_model: 64
    head_pool: mean_cat
    d_ff: None
    d_k: None
    d_v: None
    temporal_head: false
    causal: false  # auto-enabled when temporal_head=true
    temporal_head_dropout: 0.3

finetune:
    # Phase 1: Head-only training (warm up randomly initialized head)
    phase1_epochs: 5
    phase1_lr: 1.0e-3

    # Phase 2: Partial unfreeze (upper transformer layers + head)
    phase2_epochs: 12
    phase2_lr: 3.0e-4
    phase2_unfreeze_from: transformer_4_5

    # Phase 3: Full finetune (all layers, discriminative LRs)
    phase3_epochs: 16
    phase3_lr: 1.0e-4

    # Phase 4: Early prediction hardening (optional)
    enable_early_prediction: True
    phase4_epochs: 8
    phase4_lr: 5.0e-5
    masking_prob: 0.8
    early_weight: 2.0
    min_timesteps: 1

    # Discriminative learning rates
    lr_decay_factor: 0.1         # embedding_lr = head_lr * lr_decay_factor

    # Optimization
    weight_decay: 0.01
    warmup_fraction: 0.1         # fraction of phase steps for LR warmup
    grad_clip: 1.0
    label_smoothing: 0.1

    # Class imbalance
    pos_weight_factor: 0.0       # 0 for disabled scale factor for positive class weight (n_neg/n_pos * factor)

    # Validation / early stopping
    patience: 7
    valid_size: 0.2              # fraction of trainval used for validation

    # Pretrained weights
    use_pretrained: true

    # Time weighting for temporal head
    time_weighting: uniform      # 'uniform' or 'early'
    early_weight_factor: 2.0

sweep:
    # Joint architecture + training HP search (no pretraining during sweep)
    n_trials: 80
    search_space:
        # Architecture
        d_model: [32, 64, 128]
        n_layers: [2, 4, 6, 8]
        n_heads: [4, 8]
        fc_mults_1: [0.1, 0.5]
        fc_mults_2: [0.05, 0.3]
        fc_dropout: [0.1, 0.9]
        res_dropout: [0.0, 0.4]
        head_pool: [flatten, mean_cat]
        # Training HPs
        finetune_lr: [1.0e-5, 1.0e-3]       # log scale
        weight_decay: [1.0e-4, 1.0e-1]       # log scale
        label_smoothing: [0.0, 0.2]
        lr_decay_factor: [0.01, 0.5]         # log scale
        phase1_epochs: [2, 8]
        phase2_epochs: [5, 20]
        phase3_epochs: [3, 15]
        phase4_epochs: [0, 10]               # 0 = skip early prediction
        masking_prob: [0.3, 0.7]
        early_weight: [1.0, 3.0]
        pos_weight_factor: [0.3, 1.0]        # log scale

evaluation:
    max_f_beta: 10
    f_beta: 4
    threshold_mode: f1 #fbeta

normalization:
  ts_method: adaptive       # standard | quantile | power | robust | adaptive
  tab_method: adaptive      # standard | quantile | power | robust | adaptive
  n_quantiles: 1000         # max quantiles for quantile method
  quantile_output: normal   # normal | uniform

