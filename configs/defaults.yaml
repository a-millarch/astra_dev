  #- ITARespirator
  

dataset:
  exclusion: study  # null = no exclusion, or profile name: "study", "lvl1tc", etc. study3
  overwrite: True
  max_duration_days: 365 #now cut off using bins
  min_bin_seq_len: 1

  id_col: PID
  ts_cat_names:
      - Medicin
      - Procedurer
      - ADTHaendelser
      - Events
  ts_categorical_multi_label:
      - Medicin
      - Procedurer
      - ADTHaendelser
      - Events
  cat_encoder_names:
      Medicin: medication
      Procedurer: procedures
      ADTHaendelser: ADT
      Events: event

  cat_cols:
      - SEX
      - FIRST_HOSPITAL

  # Pre-hospital ABCD categorical columns (only used when prehospital: true)
  ppj_cat_cols:
      - A
      - B
      - C
      - D

  num_cols:
      - AGE
      - ASMT_ELIX
      - HEIGHT
      - WEIGHT

# Exclusion criteria profiles — selected by dataset.exclusion
exclusion_criteria:
  study:
    age_min: 0
    age_max: 90
    start_year: 2017
    end_year: null
    lvl1tc: false
    prehospital_only: true
    traumatext: true
    traumatext_12h: false
    max_duration_days: 365
    min_bin_seq_len: 1
    first_hospital:
      - null
    custom_filters: []
    # Example custom_filters:
    # - column: DURATION
    #   op: "<="
    #   value: 365

  lvl1tc:
    lvl1tc: true
    traumatext: true
    
  traumatext:
    traumatext: true

  study3:
    pid_file: data/external/studypop.csv

pretrain:
    mask_prob_ts: 0.15
    mask_prob_cat_ts: 0.15
    mask_prob_cat: 0.15
    mask_prob_cont: 0.15
    epochs: 5
    lr: 5.0e-5
    warmup_epochs: 3
    ts_loss_weight: 1.5
    cat_ts_loss_weight: 1.5
    cat_loss_weight: 1.0
    cont_loss_weight: 1.0
    contrastive_weight: 0.5
    temperature: 0.07
    patience: 3
    save_best: True
    checkpoint_dir: './pretrain_checkpoints'

training:
    folds: 5
    epochs: 30
    bs: 32
    
model:
  d_model: 128
  n_layers: 8
  n_heads: 8
  fc_mults_1: 0.10
  fc_mults_2: 0.25
  fc_dropout: 0.72
  res_dropout: 0.29
  head_pool: mean_cat
    
  temporal_head: true
  causal: true  # required for temporal_head
  temporal_head_dropout: 0.6
  survival_mode: false  # true = discrete-time survival, false = binary classification

finetune:
  phase1_epochs: 4
  phase1_lr: 0.0034069416021263346
  phase2_epochs: 8
  phase2_lr: 0.0001908557798982261
  phase3_epochs: 11
  phase3_lr: 0.0006191469401201928
  phase4_epochs: 3
  phase4_lr: 2.3558261806780157e-05
  enable_early_prediction: true
  masking_prob: 0.5631687557288182
  early_weight: 1.9118170977991875
  lr_decay_factor: 0.47227044823585246
  weight_decay: 0.0463853858389733
  label_smoothing: 0.19071867772674164
  pos_weight_factor: 0.8645166062945272
  time_weighting: early
  temporal_crop_prob: 0.42987217500631086
  temporal_crop_all_phases: true
  # ── End sweep results ──

  # Phase 2 architecture
  phase2_unfreeze_from: transformer_4_5

  # Phase 4 settings
  min_timesteps: 2

  # Optimization
  warmup_fraction: 0.1
  grad_clip: 1.0

  # Validation / early stopping
  patience: 7
  valid_size: 0.2

  # Pretrained weights
  use_pretrained: true

  # Temporal head
  early_weight_factor: 2.0

  # Temporal loss averaging
  temporal_loss_averaging: per_sample

  # Evaluation-timeframe weighting
  eval_timeframe_weighting: false
  eval_timeframe_weight: 3.0

  # Pairwise ranking loss
  ranking_loss_weight: 0.0
  ranking_loss_n_timeframes: 5
  ranking_loss_max_pairs: 10000

sweep:
    # Joint architecture + training HP search (no pretraining during sweep)
    n_trials: 200
    study_patience: 8
    search_space:
        # Architecture
        d_model: [64, 128, 192, 256]
        n_layers: [4, 6, 8, 10, 12]
        n_heads: [4, 8, 16]
        fc_mults_1: [0.05, 0.5]
        fc_mults_2: [0.05, 0.3]
        fc_dropout: [0.1, 0.9]
        res_dropout: [0.0, 0.7]
        temporal_head_dropout: [0.0, 0.8]
        head_pool: [flatten, mean_cat]
        # Training HPs (LR parameterized as base_lr × decay^phase)
        base_lr: [5.0e-4, 1.0e-2]            # log scale; phase 1 LR
        lr_phase_decay: [0.05, 0.5]          # log scale; ratio between consecutive phases
        phase1_epochs: [1, 10]
        phase2_epochs: [1, 20]
        phase3_epochs: [1, 20]
        phase4_epochs: [0, 10]               # 0 = skip early prediction
        weight_decay: [1.0e-4, 1.0e-1]       # log scale
        label_smoothing: [0.0, 0.2]
        lr_decay_factor: [0.01, 0.5]         # log scale
        masking_prob: [0.3, 0.9]
        early_weight: [1.0, 3.0]
        pos_weight_factor: [0.0, 1.0]        # linear (0 = no class weighting)
        temporal_crop_prob: [0.0, 0.8]       # probability of cropping per batch
        # Temporal loss improvements (only active when temporal_head=true)
        temporal_loss_averaging: [per_sample, global]
        eval_timeframe_weighting: [true, false]
        eval_timeframe_weight: [1.5, 5.0]    # multiplier when eval_timeframe_weighting=true
        ranking_loss_weight: [0.0, 0.3]      # 0=disabled; blended as (1-w)*bce + w*rank

evaluation:
    max_f_beta: 10
    f_beta: 4
    threshold_mode: f1 #fbeta

normalization:
  ts_method: adaptive       # standard | quantile | power | robust | adaptive
  tab_method: adaptive      # standard | quantile | power | robust | adaptive
  n_quantiles: 1000         # max quantiles for quantile method
  quantile_output: normal   # normal | uniform
  clip_range: null           # null (disabled) or [min, max] e.g. [-3, 3] to clip normalized output
  boundary_range_frac: 0.05  # fraction of value range defining boundary zone (adaptive only)
  boundary_mass_thresh: 0.40 # mass fraction in boundary zone that overrides quantile → robust

